# Recorder configuration. See docs/03_RECORDER_SPEC.md §12.
# Anything that affects env_fingerprint must not change mid-session.

[target]
window_title_re = "^랜덤 다이스 2 - CumbersomeTutor145$"  # 대변먹는자 (host/inviter); exact title: the 2nd GPG window (recorder_gpg2.toml) and the launcher must not match

# Window furniture, excluded from the content area. NOT auto-detected
# (it is not black, so the letterbox scan misses it). Measure once with
# tools/verify/g2b_chrome.py; changing it invalidates the env fingerprint.
# Values below: Google Play Games, 100% display scaling, 2026-10-16 measurement.
[target.chrome]
left   = 132                     # GPG left icon sidebar (128) + 4px black seam
top    = 72                      # title bar
right  = 0
bottom = 0
# Measured 2026-10-16 on the lobby, client 1316x2190: content = screen x 3090-4274,
# y 2272-4390 = 1184x2118 (~9:16; the render child is 1188x2126, its last 4/8 px
# fall under the window edge). LDPlayer 14 was: left 0, top 40, right 39.

# Where the bot puts the game window on start (window rect incl. its 8px
# right/bottom border, screen px). Delete this table to leave the window alone.
# 2026-10-16: top-right corner of DISPLAY2 (x 436-4276, y 2160-4560; dxcam
# output 1): x = 4276 + 8 (border) - 1384 so the client's right edge is the
# monitor's right edge. Content 1244x2224.
[target.place]
x      = 2900
y      = 2160
width  = 1384
height = 2304

[capture]
backend       = "dxcam"
target_fps    = 30
out_long_edge = 2059           # native content height (2026-10-07: 1280 made pips ~70px, too small to label)
codec         = "h264_nvenc"     # auto-falls back to libx264 if unavailable
crf           = 23
segment_sec   = 600
queue_frames  = 120              # ~4s buffer; absorbs ffmpeg process rotation
monitor_index = 1                # dxcam output index: 1 = DISPLAY2 (3840x2400), where the GPG window sits

[input]
tap_radius_n            = 0.012  # normalized distance; tap/drag boundary
record_moves_while_down = true
move_throttle_ms        = 8

[calib]
trials         = 20
button_uv      = [0.93, 0.05]    # TODO(M0): measure a safe no-op toggle button
roi_px         = 80
diff_threshold = 12.0
max_sigma_ms   = 15.0            # above this, do not start collecting

[hotkeys]
episode_toggle = "f9"
discard        = "f10"
pause          = "f11"
stop           = "f12"

[limits]
max_dup_ratio  = 0.02
min_disk_gb    = 20
watchdog_sec   = 5
fps_warn_ratio = 0.8

[data]
root = "data/sessions"
